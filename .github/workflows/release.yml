# Pushing a tag like v0.1.0 builds binaries for Linux, macOS and Windows and publishes a GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            name="macdrop_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$name/macdrop$ext" .
            cp README.md LICENSE .env.example "$name/"
            if [ "$os" = windows ]; then zip -qr "dist/$name.zip" "$name"; else tar -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
